<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Flappy Duck</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      
      <!-- UI Layer -->
      <div id="ui-layer">
        
        <!-- Start Menu -->
        <div id="start-menu" class="screen active">
          <h1>Flappy Duck</h1>
          <div class="character-selection">
            <p>Select your duck:</p>
            <div class="duck-options">
              <div class="duck-option selected" data-duck="mallard_duck.png">
                <img src="/mallard_duck.png" alt="Mallard">
              </div>
              <div class="duck-option" data-duck="white_duck.png">
                <img src="/white_duck.png" alt="White Duck">
              </div>
              <div class="duck-option" data-duck="rubber_duck.png">
                <img src="/rubber_duck.png" alt="Rubber Duck">
              </div>
            </div>
          </div>
          <button id="start-btn" class="btn">PLAY</button>
        </div>

        <!-- In Game -->
        <div id="in-game-ui" class="screen">
          <div id="score-display">0</div>
        </div>

        <!-- Game Over -->
        <div id="game-over-menu" class="screen">
          <h2>Game Over</h2>
          <div class="score-board">
            <p>Score: <span id="final-score">0</span></p>
            <p>Best: <span id="best-score">0</span></p>
          </div>
          <button id="restart-btn" class="btn">RESTART</button>
          <button id="leaderboard-btn" class="btn btn-secondary">HIGH SCORES</button>
          <button id="menu-btn" class="btn btn-secondary">MENU</button>
        </div>

        <!-- Initials Entry Screen -->
        <div id="initials-screen" class="screen">
          <div class="initials-container">
            <h2 class="initials-title">NEW HIGH SCORE!</h2>
            <p class="initials-subtitle">ENTER YOUR INITIALS</p>
            <div class="initials-score-display">SCORE: <span id="initials-score-val">0</span></div>
            <div class="initials-slots">
              <div class="initial-slot-wrapper">
                <button class="initial-arrow arrow-up" data-slot="0">&#9650;</button>
                <div class="initial-slot" id="slot-0">A</div>
                <button class="initial-arrow arrow-down" data-slot="0">&#9660;</button>
              </div>
              <div class="initial-slot-wrapper">
                <button class="initial-arrow arrow-up" data-slot="1">&#9650;</button>
                <div class="initial-slot" id="slot-1">A</div>
                <button class="initial-arrow arrow-down" data-slot="1">&#9660;</button>
              </div>
              <div class="initial-slot-wrapper">
                <button class="initial-arrow arrow-up" data-slot="2">&#9650;</button>
                <div class="initial-slot" id="slot-2">A</div>
                <button class="initial-arrow arrow-down" data-slot="2">&#9660;</button>
              </div>
            </div>
            <button id="submit-initials-btn" class="btn">SUBMIT</button>
          </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
          <h2 class="leaderboard-title">&#x1F3C6; HIGH SCORES</h2>
          <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>NAME</th>
                  <th>SCORE</th>
                </tr>
              </thead>
              <tbody id="leaderboard-body">
              </tbody>
            </table>
          </div>
          <button id="close-leaderboard-btn" class="btn">BACK</button>
        </div>

      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
